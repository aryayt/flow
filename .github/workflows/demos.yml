name: Regenerate Demos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'demos/*.tape'

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate GIFs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install VHS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install VHS
        run: |
          # Install ttyd
          wget -q https://github.com/tsl0922/ttyd/releases/download/1.7.4/ttyd.x86_64 -O /tmp/ttyd
          chmod +x /tmp/ttyd
          sudo mv /tmp/ttyd /usr/local/bin/ttyd

          # Install VHS
          go install github.com/charmbracelet/vhs@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build flow
        run: cargo build --release

      - name: Add flow to PATH
        run: echo "${{ github.workspace }}/target/release" >> $GITHUB_PATH

      - name: Generate GIFs
        run: |
          cd demos
          for tape in *.tape; do
            echo "Generating $tape..."
            vhs "$tape" || echo "Warning: $tape failed"
          done

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain demos/gifs/)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add demos/gifs/
          git commit -m "chore: regenerate demo GIFs"
          git push
