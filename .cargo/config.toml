[alias]
c = "check"
b = "build"
t = "nextest run"
r = "run"
cl = "clippy --all-targets --all-features"
f = "fmt"
lint = "clippy --all-targets --all-features -- -D warnings"
check-all = "check --all-targets --all-features --workspace"
test-all = "nextest run --workspace"

# Uncomment below if clang and lld are installed for faster linking
# [target.x86_64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[env]
RUST_BACKTRACE = "1"

[net]
git-fetch-with-cli = true
