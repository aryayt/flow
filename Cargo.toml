[workspace]
resolver = "2"
members = [
    "crates/flow-cli",
    "crates/flow-core",
    "crates/flow-git",
    "crates/flow-tmux",
    "crates/flow-sync",
    "crates/flow-db",
    "crates/flow-resolver",
    "crates/flow-server",
    "crates/flow-tui",
    "crates/flow-mcp",
    "crates/flow-orchestrator",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.80.0"
authors = ["Arya <universitybuddyai@gmail.com>"]
license = "MIT"
repository = "https://github.com/aryayt/flow"

[workspace.dependencies]
# Internal crates
agentflow-core = { path = "crates/flow-core", version = "0.1.1" }
flow-db = { path = "crates/flow-db", version = "0.1.1" }
flow-resolver = { path = "crates/flow-resolver", version = "0.1.1" }
flow-server = { path = "crates/flow-server", version = "0.1.1" }
flow-mcp = { path = "crates/flow-mcp", version = "0.1.1" }
flow-orchestrator = { path = "crates/flow-orchestrator", version = "0.1.1" }
flow-git = { path = "crates/flow-git", version = "0.1.1" }
flow-tmux = { path = "crates/flow-tmux", version = "0.1.1" }
flow-sync = { path = "crates/flow-sync", version = "0.1.1" }
flow-tui = { path = "crates/flow-tui", version = "0.1.1" }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1.36", features = ["full"] }

# Git operations
gix = { version = "0.66", default-features = false, features = ["worktree-mutation"] }

# TMUX interface
tmux_interface = "0.3"

# Fuzzy finding
skim = "0.10"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Config
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
dirs = "5.0"

# Error handling
anyhow = "1.0"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Testing
assert_cmd = "2.0"
predicates = "3.1"

# Async traits
async-trait = "0.1"

# Database
rusqlite = { version = "0.31", features = ["bundled", "backup", "functions"] }

# Web framework
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors", "compression-gzip"] }

# File watching
notify = "6"
notify-debouncer-full = "0.3"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

# Async streams
async-stream = "0.3"
futures-core = "0.3"
futures-util = { version = "0.3", features = ["sink"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
