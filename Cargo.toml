[workspace]
resolver = "2"
members = [
    "crates/flow-cli",
    "crates/flow-core",
    "crates/flow-git",
    "crates/flow-tmux",
    "crates/flow-sync",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75.0"
authors = ["Arya <universitybuddyai@gmail.com>"]
license = "MIT"
repository = "https://github.com/aryayt/flow"

[workspace.dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1.36", features = ["full"] }

# Git operations
gix = { version = "0.66", default-features = false, features = ["worktree-mutation"] }

# TMUX interface
tmux_interface = "0.3"

# Fuzzy finding
skim = "0.10"

# TUI
ratatui = "0.26"
crossterm = "0.27"

# Config
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
dirs = "5.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Testing
assert_cmd = "2.0"
predicates = "3.1"

# Async traits
async-trait = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
