[package]
name = "flow-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Git worktree and tmux workflow manager - create branches with isolated worktrees and automatic tmux sessions"
keywords = ["git", "worktree", "tmux", "cli", "workflow"]
categories = ["command-line-utilities", "development-tools"]
readme = "../../README.md"
homepage = "https://github.com/aryayt/flow"
documentation = "https://github.com/aryayt/flow#readme"

[[bin]]
