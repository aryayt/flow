flow-sync = { path = "../flow-sync" }
flow-db = { path = "../flow-db" }
flow-resolver = { path = "../flow-resolver" }
flow-server = { path = "../flow-server" }
flow-tui = { path = "../flow-tui" }

clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
